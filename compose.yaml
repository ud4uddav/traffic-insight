services:
  api:
    build:
      context: .
      dockerfile: backend/TrafficInsight.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      Digitraffic__BaseUrl: ${DIGITRAFFIC_BASE_URL:-https://tie.digitraffic.fi/}
      Digitraffic__RequestTimeoutSeconds: ${DIGITRAFFIC_TIMEOUT_SECONDS:-15}
      Traffic__RateLimitPerMinute: ${TRAFFIC_RATE_LIMIT_PER_MINUTE:-120}
      AllowedOrigins__0: ${ALLOWED_ORIGIN:-http://localhost:8080}
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_UPSTREAM: http://api:8080
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
